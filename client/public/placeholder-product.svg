<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F0"/>
      <stop offset="100%" stop-color="#F2EAE0"/>
    </linearGradient>
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B0000"/>
      <stop offset="100%" stop-color="#5E0000"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bgGrad)"/>

  <!-- Luxury Borders -->
  <rect x="24" y="24" width="752" height="952" fill="none" stroke="#E3D6C3" stroke-width="2"/>
  <rect x="36" y="36" width="728" height="928" fill="none" stroke="#8B0000" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Center Circle Graphic -->
  <circle cx="400" cy="430" r="100" fill="#EFE5D6" stroke="#D4AF37" stroke-width="2"/>

  <!-- Ethnic Kurti / Saree Emblem -->
  <g transform="translate(400, 420)">
    <!-- Hanger Hook -->
    <path d="M 0 -55 C -15 -55 -25 -40 -15 -25 C -8 -15 0 -18 0 -5" fill="none" stroke="#D4AF37" stroke-width="4" stroke-linecap="round"/>
    <!-- Shoulders -->
    <path d="M -50 0 L 50 0" stroke="#8B0000" stroke-width="5" stroke-linecap="round"/>
    <!-- Dress Silhouette -->
    <path d="M -45 0 L -25 25 L -55 75 L 55 75 L 25 25 L 45 0 Z" fill="url(#maroonGrad)"/>
    <!-- Gold Neck Motif -->
    <polygon points="0,5 -12,22 12,22" fill="#D4AF37"/>
  </g>

  <!-- Typography -->
  <text x="400" y="590" text-anchor="middle" font-family="'Playfair Display', 'Georgia', serif" font-size="34" font-weight="bold" fill="#8B0000" letter-spacing="4">NARI PEHNAWA</text>
  <text x="400" y="625" text-anchor="middle" font-family="'Montserrat', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#7A6253" letter-spacing="3">AUTHENTIC ETHNIC FASHION</text>
  <text x="400" y="660" text-anchor="middle" font-family="'Montserrat', 'Segoe UI', sans-serif" font-size="12" fill="#9C8A7B" letter-spacing="1">Product image update in progress</text>
</svg>